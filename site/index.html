<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RustWebAppCommon</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-default-route="/">
    <div class="shell">
      <header class="masthead">
        <p class="eyebrow">01 / RustWebAppCommon</p>
        <h1>统一能力底座的完整 Web + Desktop Demo</h1>
        <p class="lede">
          starter baseline 已结束；当前页面聚焦完整 demo、`Enva` 对齐、Pages/release 闭环与
          browser-backed desktop preview 的长期默认路线。
        </p>
      </header>

      <nav class="topnav" id="topnav"></nav>

      <main class="content">
        <section class="status-strip" id="status-strip"></section>
        <section class="hero-card" id="hero-card"></section>
        <section class="panel split-panel">
          <div class="panel-section" id="summary-panel"></div>
          <div class="panel-section" id="command-panel"></div>
        </section>
        <section class="panel grid-panel" id="detail-grid"></section>
        <section class="panel" id="pathways-panel"></section>
      </main>

      <footer class="footer">
        <span>Route source: `starter_demo_routes()`</span>
        <span>Runtime contract: `site/assets/runtime-contract.json`</span>
      </footer>
    </div>

    <script src="js/main.js" defer></script>
  </body>
</html>
