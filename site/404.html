<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RustWebAppCommon Fallback</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-default-route="/">
    <div class="shell">
      <header class="masthead">
        <p class="eyebrow">Fallback / 404</p>
        <h1>Route fallback preserves client-side pages</h1>
        <p class="lede">
          当前静态站点会把未知路径回退到同一套 shell，并由 `js/main.js` 按 pathname 继续渲染
          `/runtime`、`/docs-entry`、`/release-flow`、`/style-lab` 与 `detail` 页面。
        </p>
      </header>

      <nav class="topnav" id="topnav"></nav>

      <main class="content">
        <section class="status-strip" id="status-strip"></section>
        <section class="hero-card" id="hero-card"></section>
        <section class="panel split-panel">
          <div class="panel-section" id="summary-panel"></div>
          <div class="panel-section" id="command-panel"></div>
        </section>
        <section class="panel grid-panel" id="detail-grid"></section>
        <section class="panel" id="pathways-panel"></section>
      </main>

      <footer class="footer">
        <span>Pages contract: `index.html` + `404.html`</span>
        <span>Unknown routes reuse the generated shell</span>
      </footer>
    </div>

    <script src="js/main.js" defer></script>
  </body>
</html>
